name: CI

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:

jobs:
  server:
    name: server (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      # Lint: fail only on real errors (undefined names, unused imports, syntax),
      # not style — the repo doesn't enforce a line-length yet.
      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F82,F401,F811,F841 . --exclude legacy_attic

      - name: Pytest
        run: pytest -q
